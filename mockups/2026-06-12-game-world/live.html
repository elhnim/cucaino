<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cucaino — Live Canvas (device preview)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b1330; color: #fff; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #2a1d4a; position: sticky; top: 0; z-index: 5; }
  .bar b { margin-right: 10px; }
  .bar button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; background: #5b3fa0; color: #fff; }
  .bar button.active { background: #7ed957; color: #10381a; }
  .bar a { color: #9b8cff; margin-left: auto; font-size: 13px; }
  .stage { min-height: calc(100vh - 56px); display: grid; place-items: center; background: #0e0820; padding: 20px; }
  .device { border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); border: 12px solid #000; background: #000; transition: width .25s, height .25s; }
  .device.ipad { width: 1024px; height: 768px; max-width: 96vw; max-height: calc(100vh - 110px); }
  .device.iphone { width: 390px; height: 800px; max-height: calc(100vh - 110px); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #6ea843; }
</style>
</head>
<body>
  <div class="bar">
    <b>🍭 Cucaino — live canvas</b>
    <button data-dev="ipad" class="active">📱 iPad (landscape)</button>
    <button data-dev="iphone">📲 iPhone (portrait)</button>
    <button data-scene="world">🌍 World</button>
    <button data-scene="work">🏢 Work</button>
    <button data-scene="shop">🏪 Shop</button>
    <button data-scene="play">🛝 Play</button>
    <button data-scene="friends">💌 Friends</button>
    <button data-scene="pet">🐾 Pet</button>
    <a href="canvas-smoke.html" target="_blank">open full-window ↗</a>
  </div>
  <div class="stage"><div class="device ipad" id="dev"><iframe id="f" src="canvas-smoke.html"></iframe></div></div>
  <script>
    const f = document.getElementById('f'), dev = document.getElementById('dev');
    let scene = 'world';
    document.querySelectorAll('.bar button[data-dev]').forEach(b => b.onclick = () => {
      document.querySelectorAll('.bar button[data-dev]').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); dev.className = 'device ' + b.dataset.dev;
    });
    document.querySelectorAll('.bar button[data-scene]').forEach(b => b.onclick = () => {
      scene = b.dataset.scene;
      f.src = 'canvas-smoke.html' + (scene === 'world' ? '' : '?scene=' + scene);
    });
  </script>
</body>
</html>
